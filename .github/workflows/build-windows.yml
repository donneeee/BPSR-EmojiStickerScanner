name: Build Windows EXE

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Build scanner
        run: python -m PyInstaller --clean --noconfirm BPSR-Emoicon-Scanner.spec

      - name: Package artifact
        run: Compress-Archive -Path dist\BPSR-Emoicon-Scanner.exe -DestinationPath BPSR-Emoicon-Scanner.zip -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: BPSR-Emoicon-Scanner
          path: BPSR-Emoicon-Scanner.zip
